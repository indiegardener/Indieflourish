<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Indieflourish — Human-First Connection</title>
  
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#2d4a3e" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Indieflourish" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />

  <!-- External Stylesheet & Supabase SDK -->
  <link rel="stylesheet" href="style.css?v=1" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<div id="app-container">
  <!-- Top Navigation Header (Indieflourish Left, Menu Right) -->
  <header class="app-header">
    <h1 class="brand-title">Indieflourish</h1>
    <div class="menu-container">
      <button type="button" class="menu-btn" id="menu-toggle-btn" title="Menu">☰</button>
      <div id="dropdown-menu" class="dropdown-menu">
        <button type="button" class="dropdown-item" id="menu-profile-preview">👤 Profile Preview</button>
        <button type="button" class="dropdown-item" id="menu-sign-out">🚪 Sign Out</button>
        <button type="button" class="dropdown-item danger" id="menu-delete-account">⚠️ Delete Account</button>
      </div>
    </div>
  </header>

  <!-- SECTION 1: AUTHENTICATION -->
  <div id="auth-section" class="section active">
    <h2>Welcome</h2>
    <p style="font-size: 0.9rem; color: var(--text-muted); margin-bottom: 20px;">
      Sign in with your email to receive a secure verification code.
    </p>
    <div class="form-group">
      <label for="email-input">Email Address</label>
      <input type="email" id="email-input" placeholder="you@example.com" required />
    </div>
    <button type="button" id="send-magic-link-btn">Send Verification Code</button>
    <div id="auth-status" class="status-msg"></div>
  </div>

  <!-- SECTION 2: PROFILE SETUP -->
  <div id="profile-section" class="section">
    <h2>Complete Your Profile</h2>
    <p style="font-size: 0.88rem; color: var(--text-muted); margin-bottom: 16px;">
      Authentic profiles lead to meaningful matches. No performative photos required.
    </p>
    <div class="form-group">
      <label for="full-name">Full Name or Preferred Name</label>
      <input type="text" id="full-name" placeholder="e.g. Alex" required />
    </div>
    <div class="form-group">
      <label for="location">Location</label>
      <input type="text" id="location" placeholder="e.g. Samastipur, Bihar" required />
    </div>
    <div class="form-group">
      <label for="intent">Connection Intent</label>
      <select id="intent">
        <option value="both">Both Romantic & Platonic</option>
        <option value="platonic">Platonic Friendships Only</option>
        <option value="romantic">Romantic Connections Only</option>
      </select>
    </div>
    <div class="form-group">
      <label for="bio">Personal Reflection (Max 500 chars)</label>
      <textarea id="bio" rows="3" placeholder="Share what brings you joy, your quiet routines, or what you hope to cultivate..."></textarea>
    </div>
    <button type="button" id="save-profile-btn">Save Profile & Begin Quiz</button>
  </div>

  <!-- SECTION 3: QUESTIONNAIRE -->
  <div id="quiz-section" class="section">
    <div id="quiz-container"></div>
    <button type="button" id="submit-quiz-btn" style="display: none;">Submit Responses</button>
  </div>

  <!-- SECTION 4: DASHBOARD / SWIPE MATCHES -->
  <div id="dashboard-section" class="section">
    <div class="deck-subheader">
      <span style="font-weight: 600; color: var(--primary);">Discover Profiles</span>
      <span style="font-size: 0.75rem; color: var(--text-muted);">Active Chat: 0 / 3</span>
    </div>

    <!-- Larger Container for Stacked Cards -->
    <div id="deck-container" class="deck-container">
      <p style="text-align: center; color: var(--text-muted); padding-top: 140px;">Finding like-minded people...</p>
    </div>

    <!-- Action Buttons -->
    <div class="swipe-controls">
      <button type="button" class="swipe-btn pass" id="pass-btn" title="Pass">✕</button>
      <button type="button" class="swipe-btn connect" id="connect-btn" title="Connect">♥</button>
    </div>
  </div>
</div>

<!-- Profile Preview Modal -->
<div id="profile-modal" class="modal">
  <div class="modal-content">
    <h3 style="color: var(--primary); margin-bottom: 12px;">Your Profile Preview</h3>
    <div id="modal-profile-details" style="font-size: 0.9rem; color: var(--text-main); margin-bottom: 20px;">
      Loading...
    </div>
    <button type="button" id="close-modal-btn">Close</button>
  </div>
</div>

<!-- SINGLE app.js inclusion -->
<script src="app.js?v=6"></script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/sw.js').catch(err => console.log('SW registration failed:', err));
    });
  }
</script>
</body>
</html>
